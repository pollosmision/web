<header
  class="sticky top-0 z-50 border-b border-pm-border bg-pm-surface/95 shadow-pm-sm backdrop-blur"
>
  <div class="mx-auto flex h-20 w-full max-w-7xl items-center gap-4 px-4 sm:px-6 lg:px-8">
    <a
      routerLink="/"
      class="flex shrink-0 items-center gap-2 rounded-pm-sm"
      aria-label="Pollos Misión, ir al inicio"
      (click)="closeMenu()"
    >
      <span
        class="grid size-11 place-items-center rounded-full border-2 border-dashed border-pm-orange bg-pm-soft-orange text-sm font-black text-pm-red"
        aria-hidden="true"
        title="Isotipo temporal"
      >
        PM
      </span>
      <span class="hidden leading-none sm:block">
        <strong class="block text-lg font-extrabold uppercase tracking-tight text-pm-orange"
          >Pollos</strong
        >
        <strong class="block text-lg font-extrabold uppercase tracking-tight text-pm-red"
          >Misión</strong
        >
      </span>
    </a>

    <nav class="ml-auto hidden items-center gap-1 lg:flex" aria-label="Navegación principal">
      @for (item of navigationItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-pm-surface-muted text-pm-red"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="rounded-pm-md px-3 py-2 text-sm font-semibold text-pm-foreground-muted hover:bg-pm-surface-muted hover:text-pm-red"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="ml-auto flex items-center gap-2 lg:ml-2">
      <a
        routerLink="/carrito"
        class="relative grid size-11 place-items-center rounded-full text-pm-foreground hover:bg-pm-surface-muted hover:text-pm-red"
        aria-label="Ver carrito, 0 productos"
        (click)="closeMenu()"
      >
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          class="size-6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 3h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 7H6"
          />
          <circle cx="10" cy="20" r="1" />
          <circle cx="18" cy="20" r="1" />
        </svg>
        <span
          class="absolute right-0 top-0 grid size-5 place-items-center rounded-full bg-pm-red text-[0.625rem] font-bold text-white"
          aria-hidden="true"
          >0</span
        >
      </a>

      <a
        routerLink="/menu"
        class="hidden rounded-full bg-pm-orange px-5 py-3 text-sm font-bold text-white shadow-pm-sm hover:-translate-y-0.5 hover:bg-pm-red sm:inline-flex"
      >
        Pide ahora
      </a>

      <button
        #menuButton
        type="button"
        class="grid size-11 place-items-center rounded-full text-pm-foreground hover:bg-pm-surface-muted lg:hidden"
        aria-controls="mobile-navigation"
        [attr.aria-expanded]="isMenuOpen()"
        [attr.aria-label]="isMenuOpen() ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
        (click)="toggleMenu()"
      >
        @if (isMenuOpen()) {
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            class="size-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" d="m6 6 12 12M18 6 6 18" />
          </svg>
        } @else {
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            class="size-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        }
      </button>
    </div>
  </div>

  @if (isMenuOpen()) {
    <nav
      id="mobile-navigation"
      class="border-t border-pm-border bg-pm-surface px-4 py-4 lg:hidden"
      aria-label="Navegación móvil"
    >
      <div class="mx-auto flex max-w-7xl flex-col gap-1">
        @for (item of navigationItems; track item.path; let first = $first) {
          <a
            #firstMobileLink
            [routerLink]="item.path"
            routerLinkActive="bg-pm-surface-muted text-pm-red"
            [routerLinkActiveOptions]="{ exact: item.exact }"
            class="rounded-pm-md px-4 py-3 font-semibold text-pm-foreground-muted hover:bg-pm-surface-muted hover:text-pm-red"
            (click)="closeMenu()"
          >
            {{ item.label }}
          </a>
        }
        <a
          routerLink="/menu"
          class="mt-3 justify-center rounded-full bg-pm-orange px-5 py-3 text-center font-bold text-white hover:bg-pm-red sm:hidden"
          (click)="closeMenu()"
        >
          Pide ahora
        </a>
      </div>
    </nav>
  }
</header>
